; RxBridge 設定檔（UTF-8），放在 RxBridge.exe 同資料夾
; 修改後在系統匣圖示按右鍵 →「重新載入設定」

Name=福原藥局
Port=5880

; 與 調劑輸出程式 相同的 ODBC 連線字串
ConnectionString=DSN=ercrmis;UID=dba;ENP=2bf4d7163b8faf50e6e793f7f296ed57;

; 允許呼叫的網頁網址（逗號分隔）。本機測試時可暫時改成 *
AllowedOrigins=https://pharmacy-rx.linyaomedical.com

MaxRows=20

; 姓名查詢用前綴比對（王 → 王%）；想要模糊比對改成 %{q}%
NamePattern={q}%
; 輸入全數字時視為電話
PhonePattern={q}%

; ★ 請依藥局系統實際的病患資料表／欄位修改 ★
; 欄位別名固定為：name, phone, ext_id, birthday, last_visit（沒有的可以不選）
; 每個 ? 都會帶入同一個查詢字串；續行請以空白開頭
Query=SELECT TOP 20 病患姓名 AS name, 行動電話 AS phone, 病歷號 AS ext_id, 生日 AS birthday, 最後就診日 AS last_visit
  FROM 病患資料表
  WHERE 病患姓名 LIKE ? OR 行動電話 LIKE ?
  ORDER BY 最後就診日 DESC
