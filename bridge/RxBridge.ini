; RxBridge寄單系統串接 設定檔（UTF-8），檔名固定為 RxBridge.ini，放在 RxBridge寄單系統串接.exe 同資料夾
; 修改後在系統匣圖示按右鍵 →「重新載入設定」，再用「測試查詢…」確認

Name=福原藥局
Port=5880

; 與 調劑輸出程式 相同的 ODBC 連線字串
ConnectionString=DSN=ercrmis;UID=dba;ENP=2bf4d7163b8faf50e6e793f7f296ed57;

; 允許呼叫的網頁網址（逗號分隔）。本機測試時可暫時改成 *
AllowedOrigins=https://pharmacy-rx.linyaomedical.com

; 藥局系統最多回傳幾筆（網頁會把有寄單紀錄的客戶排在前面）
MaxRows=50

; ---------------------------------------------------------------------------
; 4×3 寄單貼紙列印（網頁「儲存並列印」「補印貼紙」、調劑輸出程式都會送到這裡）
; LabelPrinter：Windows「印表機」裡顯示的名稱；空白＝預設印表機
; 位置偏移可微調（mm，可為負數）
; ---------------------------------------------------------------------------
LabelPrinter=
LabelWidthMm=40
LabelHeightMm=30
LabelOffsetXmm=0
LabelOffsetYmm=0
LabelFont=Microsoft JhengHei
; QR 碼往下移的距離（mm），想再低一點就加大
LabelQrDownMm=1.5
; 右側文字行距倍率（越小越緊，建議 0.8～1.0）
LabelLineSpacing=0.88

; 藥局系統資料庫的中文編碼（Big5＝950）。Big5 沒有的字會改用萬用字元比對
CodePage=950

; 姓名模糊比對（美玲 → %美玲%）；想改成只比對開頭改成 {q}%
NamePattern=%{q}%
; 輸入全數字時視為電話（0912 → 0912%）
PhonePattern={q}%

; ---------------------------------------------------------------------------
; 藥局系統客戶資料：sa100 客戶主檔 ＋ sa110 客戶家庭健康檔（allergy 內含通知方式備註）
; 欄位別名固定：ext_id, name, idno, birthday, tel1, tel2, memo
; 每個 ? 都會帶入同一個查詢值；續行請以空白開頭
; ---------------------------------------------------------------------------
; 輸入姓名
QueryName=SELECT TOP 100 a.cus_no AS ext_id, a.name AS name, a.idno AS idno, a.birthday AS birthday,
  a.tel1 AS tel1, a.tel2 AS tel2, b.allergy AS memo
  FROM sa100 a LEFT JOIN sa110 b ON a.cus_no = b.cus_no
  WHERE a.name LIKE ?
  ORDER BY a.name
; 輸入全數字（電話）：電話欄位可能含 - 或空白，先去掉再比對
QueryPhone=SELECT TOP 100 a.cus_no AS ext_id, a.name AS name, a.idno AS idno, a.birthday AS birthday,
  a.tel1 AS tel1, a.tel2 AS tel2, b.allergy AS memo
  FROM sa100 a LEFT JOIN sa110 b ON a.cus_no = b.cus_no
  WHERE REPLACE(REPLACE(a.tel1, '-', ''), ' ', '') LIKE ? OR REPLACE(REPLACE(a.tel2, '-', ''), ' ', '') LIKE ?
  ORDER BY a.name
; 輸入民國生日（750312、0750312、75/3/12）：程式會轉成西元 yyyy/MM/dd 再比對 sa100.birthday
QueryBirth=SELECT TOP 100 a.cus_no AS ext_id, a.name AS name, a.idno AS idno, a.birthday AS birthday,
  a.tel1 AS tel1, a.tel2 AS tel2, b.allergy AS memo
  FROM sa100 a LEFT JOIN sa110 b ON a.cus_no = b.cus_no
  WHERE a.birthday = ?
  ORDER BY a.name
; 輸入身分證／居留證號（完整 10 碼）
QueryIdno=SELECT TOP 10 a.cus_no AS ext_id, a.name AS name, a.idno AS idno, a.birthday AS birthday,
  a.tel1 AS tel1, a.tel2 AS tel2, b.allergy AS memo
  FROM sa100 a LEFT JOIN sa110 b ON a.cus_no = b.cus_no
  WHERE a.idno = ?
; 掃描處方箋 QR：身分證有隱碼（A123***481）及／或生日有隱碼（1966/**/26）時使用
; 第一個 ? = 身分證（隱碼換成 _，沒有身分證時為 %）；第二個 ? = 生日（例 1966_03_26、1966____26，沒有生日時為 %）
; 若藥局系統的 birthday 欄位不是文字型態，請改成 CONVERT(VARCHAR(10), a.birthday, 111) LIKE ?
QueryMatch=SELECT TOP 100 a.cus_no AS ext_id, a.name AS name, a.idno AS idno, a.birthday AS birthday,
  a.tel1 AS tel1, a.tel2 AS tel2, b.allergy AS memo
  FROM sa100 a LEFT JOIN sa110 b ON a.cus_no = b.cus_no
  WHERE a.idno LIKE ? AND a.birthday LIKE ?
  ORDER BY a.name
